<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cubing Armenia has moved to cubing.am</title>
<!-- GitHub Pages can't issue a real 301, so this is the closest equivalent:
     canonical tells search engines which URL is authoritative, the refresh covers
     visitors with JavaScript off, and the script below redirects everyone else. -->
<link rel="canonical" href="https://cubing.am/competitions">
<meta http-equiv="refresh" content="0; url=https://cubing.am/competitions">
<meta name="robots" content="noindex, follow">
<style>
  body { font-family: system-ui, sans-serif; margin: 15vh auto; max-width: 32rem;
         padding: 0 1.5rem; text-align: center; color: #232326; line-height: 1.6; }
  a { color: #0733A0; }
</style>
</head>
<body>
<p>Cubing Armenia has moved to <a href="https://cubing.am/competitions">cubing.am</a>.</p>
<p>Կուբինգ Հայաստանը տեղափոխվել է <a href="https://cubing.am/competitions">cubing.am</a>։</p>
<script>
  // replace() rather than assign(): the visitor's Back button should return them
  // to wherever they came from, not bounce them through this page again.
  location.replace('https://cubing.am/competitions' + location.hash);
</script>
</body>
</html>
